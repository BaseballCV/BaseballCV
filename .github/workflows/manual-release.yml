name: Manual Release
# This will include the pypi publish as well

on: 
  workflow_dispatch:
    inputs:
      bump:
        description: "Version type (refactor, major, minor, patch)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - refactor

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set up Git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Get latest tag
        id: get_tag
        shell: bash
        run: |
          git fetch --tags
          LATEST_TAG=$(git describe --tags --abbrev=0)
          echo "Latest Tag: $LATEST_TAG"
          echo "tag=LATEST_TAG" >> "$GITHUB_OUTPUT"
      
      - name: Bump version
        id: bump
        run: |
          CURRENT="${{ steps.get_tag.outputs.tag }}"
          CURRENT_STRP="${CURRENT#v}" # strip the 'v'

          IFS='.' read -r REFACTOR MAJOR MINOR PATCH <<< "$CURRENT_STRP"

          case "${{ inputs.bump }}" in
            refactor)
              ((REFACTOR+=1))
              MAJOR=0
              MINOR=0
              PATCH=0
              ;;
            major)
              ((MAJOR+=1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              ((MINOR+=1))
              PATCH=0
              ;;
            patch)
              ((PATCH+=1))
              ;;
            *)
              echo "❌ Invalid bump type: ${{ inputs.bump }}"
              exit 1
              ;;
          esac

          NEW_TAG="v${REFACTOR}.${MAJOR}.${MINOR}.${PATCH}"
          echo "🔖 New tag will be: $NEW_TAG"

          # Output for other steps
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Create git tag
        shell: bash
        run: |
          git tag ${{ steps.bump.outputs.new_tag }}
          git push origin ${{ steps.bump.outputs.new_tag }}
      
      - name: Edit README File
        shell: bash
        run: |
          VERSION="${{ steps.bump.outputs.new_tag }}"
          RECENT_CHANGES=$(git log "$VERSION"..HEAD --merges  --pretty=format:"- %s (%h) — by %an")
          VERSION="${VERSION#v}"   # removes leading 'v' if present
         
          export RECENT_CHANGES
          export VERSION

          # Replace {{CHANGES}} placeholder in README file
          perl -i.bak -pe '
          BEGIN {
            $ENV{"RECENT_CHANGES"} =~ s/\r?\n/\n/g;
            $ENV{"VERSION"} =~ s/\r?\n/\n/g;
          }
          s/\{\{CHANGES\}\}/$ENV{"RECENT_CHANGES"}/g;
          s/\{\{VERSION\}\}/$ENV{"VERSION"}/g;
          ' .github/RELEASE_TEMPLATE.md

      - name: Create github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.new_tag }}
          draft: true
          body_path: .github/RELEASE_TEMPLATE.md

  deploy-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install poetry build setuptools wheel

    - name: Build package
      run: |
        poetry build

    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_TOKEN }}
